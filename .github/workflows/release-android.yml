# Generated by Avokaido. Builds a release Android App Bundle on every push to
# main and keeps it as a workflow artifact; uploads it to Google Play's
# internal testing track when the workspace has Play credentials.
#
# Signing: the project's own upload key, generated when it was created and
# kept in this repository's Actions secrets (ANDROID_UPLOAD_KEYSTORE_*).
# Without it the bundle is signed with a debug key, which Play refuses — the
# build still runs, so a broken release build is found here and not later.
#
# Written when the project was created, and locked: Avokaido's agent may not
# change how the app is released.
name: Release (Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Queue overlapping runs: two uploads racing for one version code lose both.
concurrency:
  group: release-android
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Decode the upload key
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
            echo "path=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::notice::No upload key in this repository's secrets; the bundle is signed with a debug key and cannot go to Google Play."
          fi

      # The run number is the version code, so every upload is newer than the
      # last one — Play refuses a version code it has seen.
      - name: Build the app bundle
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          flutter build appbundle --release \
            --build-number=${{ github.run_number }} \
            --dart-define=AVOKAIDO_MAIL_URL="${{ secrets.AVOKAIDO_MAIL_URL }}" \
            --dart-define=AVOKAIDO_MAIL_KEY="${{ secrets.AVOKAIDO_MAIL_KEY }}" \
            --dart-define=AVOKAIDO_MAIL_FROM="${{ secrets.AVOKAIDO_MAIL_FROM }}" \
            --dart-define=AVOKAIDO_WORKSPACE_ID="${{ secrets.AVOKAIDO_WORKSPACE_ID }}" \
            --dart-define=AVOKAIDO_REPO_SLUG="${{ secrets.AVOKAIDO_REPO_SLUG }}" \
            --dart-define=AVOKAIDO_IDEA_KEY="${{ secrets.AVOKAIDO_IDEA_KEY }}" \
            --dart-define=AVOKAIDO_ESIGN_URL="${{ secrets.AVOKAIDO_ESIGN_URL }}"

      # ALWAYS, whatever happens to the upload below: the bundle is the
      # deliverable, and a person can upload it by hand.
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Check Google Play credentials
        id: play
        env:
          PLAY: ${{ secrets.PLAY_DEVELOPER_SERVICE_ACCOUNT }}
          KEYSTORE: ${{ steps.keystore.outputs.path }}
        run: |
          if [ -n "$PLAY" ] && [ -n "$KEYSTORE" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Google Play is not set up for this workspace; the bundle is kept as an artifact instead of uploaded."
          fi

      - uses: ruby/setup-ruby@v1
        if: steps.play.outputs.configured == 'true'
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # NEVER FAILS THE RUN. Google Play refuses API uploads for an app until
      # its first bundle has been uploaded by hand in Play Console, so the
      # first runs of every new app fail here by design.
      - name: Upload to Google Play internal testing
        if: steps.play.outputs.configured == 'true'
        continue-on-error: true
        env:
          PLAY_DEVELOPER_SERVICE_ACCOUNT: ${{ secrets.PLAY_DEVELOPER_SERVICE_ACCOUNT }}
        run: |
          echo "::notice::A new app's first bundle must be uploaded by hand in Play Console; until then this step fails and the bundle above is the release."
          bundle exec fastlane android internal
