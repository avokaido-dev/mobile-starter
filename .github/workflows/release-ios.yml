# Generated by Avokaido. Builds the iOS app on every push to main. With the
# workspace's App Store Connect key and its certificates repository it signs
# the build and uploads it to TestFlight; without them it builds an unsigned
# Runner.app and keeps that as a workflow artifact.
#
# Signing is fastlane match: the distribution certificate and profiles live,
# encrypted with MATCH_PASSWORD, in the workspace's certificates repository,
# which this repository reaches with its own deploy key (MATCH_GIT_PRIVATE_KEY).
#
# Written when the project was created, and locked: Avokaido's agent may not
# change how the app is released.
name: Release (iOS)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-ios
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    # App Store uploads must be built with Apple's current SDK, which only the
    # newest macOS images carry.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Check App Store credentials
        id: cfg
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          MATCH: ${{ secrets.MATCH_PASSWORD }}
          CERTS_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY_ID" ] && [ -n "$ISSUER" ] && [ -n "$P8" ] && [ -n "$MATCH" ] && [ -n "$CERTS_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::App Store Connect is not set up for this workspace; building an unsigned Runner.app instead of uploading to TestFlight."
          fi

      # ---- Without credentials: an unsigned build, kept as the artifact ----
      - name: Build unsigned
        if: steps.cfg.outputs.configured != 'true'
        run: |
          flutter build ios --release --no-codesign \
            --build-number=${{ github.run_number }} \
            --dart-define=AVOKAIDO_MAIL_URL="${{ secrets.AVOKAIDO_MAIL_URL }}" \
            --dart-define=AVOKAIDO_MAIL_KEY="${{ secrets.AVOKAIDO_MAIL_KEY }}" \
            --dart-define=AVOKAIDO_MAIL_FROM="${{ secrets.AVOKAIDO_MAIL_FROM }}" \
            --dart-define=AVOKAIDO_WORKSPACE_ID="${{ secrets.AVOKAIDO_WORKSPACE_ID }}" \
            --dart-define=AVOKAIDO_REPO_SLUG="${{ secrets.AVOKAIDO_REPO_SLUG }}" \
            --dart-define=AVOKAIDO_IDEA_KEY="${{ secrets.AVOKAIDO_IDEA_KEY }}" \
            --dart-define=AVOKAIDO_ESIGN_URL="${{ secrets.AVOKAIDO_ESIGN_URL }}"

      - name: Package Runner.app
        if: steps.cfg.outputs.configured != 'true'
        run: ditto -c -k --keepParent build/ios/iphoneos/Runner.app build/ios/Runner-unsigned.zip

      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.configured != 'true'
        with:
          name: runner-app-unsigned
          path: build/ios/Runner-unsigned.zip
          if-no-files-found: error

      # ---- With credentials: signed, and uploaded to TestFlight ------------
      - uses: webfactory/ssh-agent@v0.9.0
        if: steps.cfg.outputs.configured == 'true'
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}

      - uses: ruby/setup-ruby@v1
        if: steps.cfg.outputs.configured == 'true'
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Writes the build settings (version, Avokaido's coordinates) and
      # installs the pods, so the archive below builds exactly this.
      - name: Prepare the Xcode project
        if: steps.cfg.outputs.configured == 'true'
        run: |
          flutter build ios --release --config-only \
            --build-number=${{ github.run_number }} \
            --dart-define=AVOKAIDO_MAIL_URL="${{ secrets.AVOKAIDO_MAIL_URL }}" \
            --dart-define=AVOKAIDO_MAIL_KEY="${{ secrets.AVOKAIDO_MAIL_KEY }}" \
            --dart-define=AVOKAIDO_MAIL_FROM="${{ secrets.AVOKAIDO_MAIL_FROM }}" \
            --dart-define=AVOKAIDO_WORKSPACE_ID="${{ secrets.AVOKAIDO_WORKSPACE_ID }}" \
            --dart-define=AVOKAIDO_REPO_SLUG="${{ secrets.AVOKAIDO_REPO_SLUG }}" \
            --dart-define=AVOKAIDO_IDEA_KEY="${{ secrets.AVOKAIDO_IDEA_KEY }}" \
            --dart-define=AVOKAIDO_ESIGN_URL="${{ secrets.AVOKAIDO_ESIGN_URL }}"

      - name: Sign and upload to TestFlight
        if: steps.cfg.outputs.configured == 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane ios testflight

      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.configured == 'true'
        with:
          name: app-store-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: warn
